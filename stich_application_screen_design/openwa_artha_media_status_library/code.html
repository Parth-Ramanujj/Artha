  <script>
    (function () {
      const filters = document.querySelectorAll('.media-filter');
      const items = document.querySelectorAll('.media-item');
      const modal = document.getElementById('asset-action-modal');
      const closeModal = document.getElementById('close-asset-modal');

      filters.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const f = btn.getAttribute('data-filter');
          filters.forEach(function (b) {
            const active = b === btn;
            b.setAttribute('aria-selected', String(active));
            b.classList.toggle('bg-primary', active);
            b.classList.toggle('text-on-primary', active);
            b.classList.toggle('bg-surface-container', !active);
            b.classList.toggle('border', !active);
            b.classList.toggle('border-outline-variant', !active);
            b.classList.toggle('text-on-surface-variant', !active);
          });
          items.forEach(function (item) {
            const cat = item.getAttribute('data-category');
            item.classList.toggle('hidden', f !== 'all' && cat !== f);
          });
        });
      });

      document.querySelectorAll('.open-actions-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (modal) modal.classList.remove('hidden');
        });
      });

      if (closeModal && modal) {
        closeModal.addEventListener('click', function () { modal.classList.add('hidden'); });
      }
      if (modal) {
        modal.addEventListener('click', function (e) {
          if (e.target === modal) modal.classList.add('hidden');
        });
      }
      document.querySelectorAll('.asset-action-item').forEach(function (item) {
        item.addEventListener('click', function () {
          if (modal) modal.classList.add('hidden');
        });
      });

      document.querySelectorAll('.snippet-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const badge = btn.querySelector('.snippet-badge');
          if (badge) {
            badge.textContent = 'Copied!';
            setTimeout(function () { badge.textContent = 'Copy / Send'; }, 1200);
          }
        });
      });
    })();
  </script>
